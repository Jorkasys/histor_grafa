# Настройки драйвера FreeTDS (pymssql). Путь к файлу задаёт FREETDSCONF в Dockerfile.
[global]
    # Протокол SQL Server 2012 и новее
    tds version = 7.4
    # Вход учётной записью Windows (ДОМЕН\логин): только NTLMv2 — NTLMv1
    # в доменах обычно запрещён
    use ntlmv2 = yes
    # Шифровать, если сервер умеет; сертификат сервера не проверяется
    encryption = request
    client charset = UTF-8
